name: split_ex
description: "SplitEx - Roommate Expense Splitting App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.7
  firebase_storage: ^12.4.4
  firebase_crashlytics: ^4.3.3

  # Auth
  google_sign_in: ^6.2.2

  # Navigation
  go_router: ^15.1.2

  # UI & Charts
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  pdf: ^3.11.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icons/app_icon.png"

  adaptive_icon_background: "#14B8A6"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Gilmer
      fonts:
        - asset: assets/fonts/Gilmer-Light.otf
          weight: 300
        - asset: assets/fonts/Gilmer-Regular.otf
          weight: 400
        - asset: assets/fonts/Gilmer-Medium.otf
          weight: 500
        - asset: assets/fonts/Gilmer-Bold.otf
          weight: 700
        - asset: assets/fonts/Gilmer-Heavy.otf
          weight: 900
